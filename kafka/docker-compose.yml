version: '3.8'

services:
  # ZooKeeper for Kafka
  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - ignite-network
    restart: unless-stopped

  # Kafka
  kafka:
    image: wurstmeister/kafka:2.13-2.7.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "ignite_cdc_data:3:1,ignite_cdc_meta:1:1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT # опционально
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # опционально
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1 # опционально
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1 # опционально
      KAFKA_LOG_RETENTION_HOURS: 168  # 7 дней
      KAFKA_LOG_SEGMENT_BYTES: 1073741824  # 1GB
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
#      - ./kafka-data:/var/lib/kafka/data
#      - ./kafka-logs:/var/lib/kafka/logs
    networks:
      - ignite-network
      - shared-network
    restart: unless-stopped

  # Kafka UI for monitoring Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - ignite-network
    restart: unless-stopped

networks:
  ignite-network:
    driver: bridge
    name: ignite-network
  shared-network:
    external: true